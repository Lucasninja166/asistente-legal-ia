<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditoría IA</title>
</head>

<body>

<h2>Auditoría de Prompt</h2>

<textarea id="texto" rows="10" cols="60"></textarea>

<br><br>

<button id="btnPagar">
Iniciar auditoría
</button>

<script>

document.getElementById("btnPagar").addEventListener("click", function(){

    const texto = document.getElementById("texto").value;

    if(texto.trim()==""){
        alert("Escribí un texto.");
        return;
    }

    localStorage.setItem("textoAuditoria",texto);

    // Link de Mercado Pago
    window.location.href="https://mpago.la/TU_LINK";

});

</script>

</body>
</html>
