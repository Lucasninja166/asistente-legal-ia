<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Procesando...</title>
</head>

<body>

<h2>Procesando auditoría...</h2>

<div id="resultado"></div>

<script>

const texto = localStorage.getItem("textoAuditoria");

if(!texto){
    document.getElementById("resultado").innerHTML =
        "No se encontró el texto.";
}
else{

    fetch("https://TU-BACKEND.onrender.com/auditar",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            texto:texto
        })

    })

    .then(r=>r.json())

    .then(data=>{

        document.getElementById("resultado").innerHTML=data.resultado;

        localStorage.removeItem("textoAuditoria");

    })

    .catch(err=>{

        document.getElementById("resultado").innerHTML=
        "Error al realizar la auditoría.";

        console.log(err);

    });

}

</script>

</body>
</html>
